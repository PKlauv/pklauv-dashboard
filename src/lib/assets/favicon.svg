<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>PK Lauvstad</title>
  <!-- dark tile with chunky stepped-rounded corners -->
  <g fill="#0a0a0a">
    <rect x="3" y="0" width="26" height="1"/>
    <rect x="2" y="1" width="28" height="1"/>
    <rect x="1" y="2" width="30" height="1"/>
    <rect x="0" y="3" width="32" height="26"/>
    <rect x="1" y="29" width="30" height="1"/>
    <rect x="2" y="30" width="28" height="1"/>
    <rect x="3" y="31" width="26" height="1"/>
  </g>
  <!-- // slashes (stair-stepped) -->
  <g fill="#3b82f6">
    <rect x="8" y="11" width="2" height="1"/>
    <rect x="9" y="10" width="2" height="1"/>
    <rect x="10" y="9" width="2" height="1"/>
    <rect x="11" y="8" width="2" height="1"/>
    <rect x="12" y="7" width="2" height="1"/>
    <rect x="13" y="6" width="2" height="1"/>
    <rect x="14" y="5" width="2" height="1"/>
    <rect x="16" y="11" width="2" height="1"/>
    <rect x="17" y="10" width="2" height="1"/>
    <rect x="18" y="9" width="2" height="1"/>
    <rect x="19" y="8" width="2" height="1"/>
    <rect x="20" y="7" width="2" height="1"/>
    <rect x="21" y="6" width="2" height="1"/>
    <rect x="22" y="5" width="2" height="1"/>
  </g>
  <!-- empty gap on rows 12-14 -->
  <!-- PK letters -->
  <g fill="#e5e5e5">
    <!-- P -->
    <rect x="6" y="15" width="2" height="12"/>
    <rect x="6" y="15" width="8" height="2"/>
    <rect x="12" y="15" width="2" height="6"/>
    <rect x="6" y="19" width="8" height="2"/>
    <!-- K stem -->
    <rect x="17" y="15" width="2" height="12"/>
    <!-- K upper arm -->
    <rect x="23" y="15" width="2" height="1"/>
    <rect x="22" y="16" width="2" height="1"/>
    <rect x="21" y="17" width="2" height="1"/>
    <rect x="20" y="18" width="2" height="1"/>
    <rect x="19" y="19" width="2" height="1"/>
    <rect x="18" y="20" width="2" height="1"/>
    <!-- K lower arm -->
    <rect x="18" y="21" width="2" height="1"/>
    <rect x="19" y="22" width="2" height="1"/>
    <rect x="20" y="23" width="2" height="1"/>
    <rect x="21" y="24" width="2" height="1"/>
    <rect x="22" y="25" width="2" height="1"/>
    <rect x="23" y="26" width="2" height="1"/>
  </g>
</svg>
